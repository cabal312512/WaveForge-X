experiment:
  name: offline_validation
  seeds:
  - 201
  - 202
  - 203
  split: validation
system:
  frame_size: 32
  cp_length: 8
  subcarriers: 8
  sample_rate_hz: 64000
  modulation: qpsk
receiver:
  detector: lmmse
  solver: auto
  dense_threshold: 64
  rtol: 1.0e-08
dynamic:
  scenario: mixed_extreme_mobility
  epochs: 120
  change_interval: 30
  max_doppler_hz: 2400
  snr_db: 12
  delay_samples: 6
observation:
  snr_std: 1
  doppler_relative_error: 0.12
  delay_spread_relative_error: 0.12
  delay_frames: 1
objective:
  ber_weight: 1
  bler_weight: 0.2
  papr_weight: 0.05
  complexity_weight: 0.05
  switching_weight: 0.1
  papr_reference_db: 12
  complexity_reference: 1000000
selectors:
- name: offline
  type: offline
  model: data/models/offline_selector.json
- name: rule
  type: rule
cache:
  enabled: true
sweep: {}
