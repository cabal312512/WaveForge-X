experiment:
  name: smoke
  seeds:
  - 11
  - 22
  - 33
  split: test
system:
  frame_size: 16
  cp_length: 4
  subcarriers: 4
  sample_rate_hz: 64000
  modulation: qpsk
receiver:
  detector: lmmse
  solver: auto
  dense_threshold: 64
  rtol: 1.0e-08
dynamic:
  scenario: mixed_extreme_mobility
  epochs: 15
  change_interval: 5
  max_doppler_hz: 2400
  snr_db: 12
  delay_samples: 6
observation:
  snr_std: 1
  doppler_relative_error: 0.12
  delay_spread_relative_error: 0.12
  delay_frames: 1
objective:
  ber_weight: 1
  bler_weight: 0.2
  papr_weight: 0.05
  complexity_weight: 0.05
  switching_weight: 0.1
  papr_reference_db: 12
  complexity_reference: 1000000
selectors:
- name: always_ofdm
  type: static
  action: 0
- name: ucb
  type: ucb
- name: uncertainty_aware
  type: linucb
  alpha: 0.4
  window: 24
  policy: uncertainty
  base_threshold: 0.01
  uncertainty_alpha: 0.08
  max_hold: 15
  change_detection:
    threshold: 0.25
    delta: 0.01
    feature_index: 2
    min_instances: 10
cache:
  enabled: true
sweep: {}
