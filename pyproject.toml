[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "waveforge-x"
version = "1.1.0"
description = "Decision-aware, compute-budgeted wireless receivers and reproducible research evidence"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "cabal312512"}]
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "matplotlib>=3.8,<4", "pandas>=2.1,<3", "PyYAML>=6,<7", "tqdm>=4.66,<5"]
keywords = ["wireless", "LMMSE", "OFDM", "OTFS", "AFDM", "conjugate-gradient"]

[project.urls]
Repository = "https://github.com/cabal312512/WaveForge-X"
Issues = "https://github.com/cabal312512/WaveForge-X/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
waveforge6g = "waveforge6g.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
cache_dir = ".cache/pytest"
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
  "slow: extended statistical validation",
  "regression: deterministic compact reference checks",
]
